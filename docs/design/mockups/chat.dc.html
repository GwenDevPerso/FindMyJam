<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FindMyJam — Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=JetBrains+Mono:wght@400;600&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22e3ff}a:hover{color:#8ff3ff}
input::placeholder{color:#9a8abc}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b0716; color: #f4ecff; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; gap: 12px; padding: 56px 16px 14px 16px; border-bottom: 1px solid #2a1c44; background: #140c26">
<a href="Jam.dc.html" aria-label="Back to the jam" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 12px; border: 1px solid #3a2a5c; background: #0b0716; color: #f4ecff; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<h1 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 22px; letter-spacing: 0.03em; line-height: 1.05">JAZZ STANDARDS SESSION</h1>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: {{neon}}">SERIES ROOM · ALL DATES · 11 MEMBERS</div>
</div>
</header>

<div aria-live="polite" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #b9a8d6; padding: 4px 10px; border-radius: 999px; border: 1px solid #2a1c44">TODAY</div>
<sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
<div style="{{m.rowStyle}}">
<sc-if value="{{m.other}}" hint-placeholder-val="{{true}}">
<span aria-hidden="true" style="{{m.avatarStyle}}">{{m.initials}}</span>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 76%">
<sc-if value="{{m.other}}" hint-placeholder-val="{{true}}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #b9a8d6">@{{m.user}}</span>
</sc-if>
<div style="{{m.bubbleStyle}}">{{m.body}}</div>
<span style="{{m.timeStyle}}">{{m.time}}</span>
</div>
</div>
</sc-for>
</div>

<form onSubmit="{{send}}" style="background: #140c26; border-top: 1px solid #2a1c44; padding: 12px 16px 30px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 10px; align-items: center">
<label for="fmj-message" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
<input id="fmj-message" value="{{draft}}" onChange="{{onDraft}}" maxlength="2000" placeholder="Message the musicians…" style="flex: 1 1 auto; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #3a2a5c; background: #0b0716; color: #f4ecff; font-family: 'Space Grotesk', sans-serif; font-size: 15px; outline-color: {{neon}}">
<button type="submit" aria-label="Send message" style="{{sendStyle}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2-7z"></path></svg>
</button>
</div>
<div style="font-size: 11px; color: #9a8abc; text-align: center">Messages can't be edited. Long-press one of yours to delete it.</div>
</form>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff2e88","options":["#ff2e88","#ff8a3d","#b14cff"]},"neon":{"editor":"color","default":"#22e3ff","options":["#22e3ff","#5dff9e","#ffd23d"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
draft: '',
messages: [
{ user: 'marie_keys', initials: 'MK', body: 'Reminder: first set at 19:30 sharp. Autumn Leaves, then Blue Bossa.', time: '17:42' },
{ user: 'tom_drums', initials: 'TD', body: "I'll bring brushes and a cajon for the quiet tunes.", time: '17:48' },
{ user: 'me', initials: 'ME', body: "Great, I'm on bass tonight. Is there an amp on site?", time: '17:55' },
{ user: 'marie_keys', initials: 'MK', body: 'Yes, a small combo. Bring your own cable.', time: '17:57' }
]
};
}
renderVals() {
const accent = this.props.accent ?? '#ff2e88';
const neon = this.props.neon ?? '#22e3ff';
const colorFor = { marie_keys: accent, tom_drums: neon };
const messages = this.state.messages.map((m) => {
const mine = m.user === 'me';
const color = colorFor[m.user] || '#b14cff';
return {
user: m.user, initials: m.initials, body: m.body, time: m.time, other: !mine,
rowStyle: 'display: flex; gap: 8px; align-items: flex-end; ' + (mine ? 'justify-content: flex-end;' : ''),
avatarStyle: 'width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; background: ' + color + "; color: #12051f; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; margin-bottom: 20px;",
bubbleStyle: 'padding: 10px 14px; font-size: 15px; line-height: 1.4; ' +
  (mine ? 'border-radius: 18px 18px 4px 18px; background: ' + accent + '; color: #12051f; box-shadow: 0 0 16px rgba(255, 46, 136, 0.35);' : 'border-radius: 18px 18px 18px 4px; background: #140c26; border: 1px solid #2a1c44; color: #f4ecff;'),
timeStyle: "font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #9a8abc; " + (mine ? 'text-align: right;' : '')
};
});
const canSend = this.state.draft.trim().length > 0;
return {
accent, neon, messages,
draft: this.state.draft,
onDraft: (e) => this.setState({ draft: e.target.value }),
send: (e) => {
e.preventDefault();
const body = this.state.draft.trim();
if (!body) return;
this.setState({ draft: '', messages: this.state.messages.concat([{ user: 'me', initials: 'ME', body, time: 'now' }]) });
},
sendStyle: 'width: 48px; height: 48px; flex: 0 0 48px; border-radius: 14px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; ' +
  (canSend ? 'background: ' + accent + '; color: #12051f; box-shadow: 0 0 16px ' + accent + ';' : 'background: #2a1c44; color: #9a8abc;')
};
}
}
</script>
</body>
</html>
