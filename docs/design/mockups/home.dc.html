<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FindMyJam — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=JetBrains+Mono:wght@400;600&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22e3ff}a:hover{color:#8ff3ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b0716; color: #f4ecff; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 8px 20px">
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-family: 'Anton', Impact, sans-serif; font-size: 30px; letter-spacing: 0.05em; line-height: 1">FINDMY<span style="color: {{accent}}; text-shadow: 0 0 14px {{accent}}">JAM</span></div>
<div style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: {{neon}}"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: {{neon}}; box-shadow: 0 0 8px {{neon}}"></span>PARIS 11E · 25 KM</div>
</div>
<div style="display: flex; gap: 8px">
<button aria-label="Open calendar" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3a2a5c; background: #140c26; color: #f4ecff; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
</button>
<button aria-label="Notifications, 3 unread" style="position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3a2a5c; background: #140c26; color: #f4ecff; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
<span aria-hidden="true" style="position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: {{accent}}; color: #12051f; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px {{accent}}">3</span>
</button>
</div>
</header>

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 20px 16px 20px; display: flex; flex-direction: column; gap: 18px">

<section aria-label="Your next jam" style="border-radius: 24px; overflow: hidden; border: 1px solid #4a2a6a; background: #140c26">
<div aria-hidden="true" style="height: 118px; position: relative; overflow: hidden; background: linear-gradient(180deg, #1b0830 0%, #4a1250 40%, #b8325f 62%, #ff7a45 68%, #120821 68.5%, #0b0716 100%)">
<div style="position: absolute; left: 50%; top: 18px; width: 88px; height: 88px; margin-left: -44px; border-radius: 50%; background: repeating-linear-gradient(180deg, #ffd36b 0px, #ff5f8f 50px, transparent 50px, transparent 55px, #ff5f8f 55px, #ff3d8b 88px)"></div>
<div style="position: absolute; left: -40%; right: -40%; bottom: 0; height: 32%; transform: perspective(200px) rotateX(58deg); transform-origin: 50% 100%; background-image: linear-gradient({{neon}} 1px, transparent 1px), linear-gradient(90deg, {{neon}} 1px, transparent 1px); background-size: 26px 26px; opacity: 0.5"></div>
</div>
<div style="padding: 16px 18px 18px 18px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: {{neon}}">YOUR NEXT JAM · TONIGHT 20:30</div>
<h1 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05; letter-spacing: 0.02em">FUNK NIGHT AT LE COMPTOIR</h1>
<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 5px 9px; border-radius: 6px; border: 1px solid {{accent}}; color: #ffc2dc">EVERY 2 WEEKS</span>
<span style="font-size: 13px; color: #d9ccef">0.6 km · 6 / 8 musicians</span>
</div>
<a href="Jam.dc.html" style="margin-top: 6px; height: 52px; border-radius: 16px; background: {{accent}}; color: #12051f; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; box-shadow: 0 0 22px {{accent}}; display: flex; align-items: center; justify-content: center; text-decoration: none">Open jam →</a>
</div>
</section>

<section aria-label="Jams near you" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 24px; letter-spacing: 0.03em">JAMS NEAR YOU</h2>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #b9a8d6">BY DISTANCE</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{neon}}; background: #140c26; color: {{neon}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer">25 km</button>
<button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #3a2a5c; background: #140c26; color: #e2d6f5; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer">Any date</button>
<button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #3a2a5c; background: #140c26; color: #e2d6f5; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer">All styles</button>
</div>
<sc-for list="{{jams}}" as="jam" hint-placeholder-count="3">
<a href="Jam.dc.html" style="border-radius: 18px; border: 1px solid #2a1c44; background: #140c26; color: #f4ecff; text-decoration: none; padding: 14px; display: flex; gap: 14px; align-items: stretch">
<div style="width: 58px; flex: 0 0 58px; border-radius: 12px; border: 1px solid #3a2a5c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #0f0a1f">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{neon}}">{{jam.day}}</span>
<span style="font-family: 'Anton', Impact, sans-serif; font-size: 24px; line-height: 1">{{jam.date}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #b9a8d6">{{jam.time}}</span>
</div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="font-weight: 700; font-size: 16px; line-height: 1.25">{{jam.title}}</div>
<div style="font-size: 13px; color: #d9ccef">{{jam.meta}}</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
<span style="{{jam.seatsStyle}}">{{jam.seats}}</span>
<sc-if value="{{jam.recurring}}" hint-placeholder-val="{{false}}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 7px; border-radius: 5px; border: 1px solid #5a4a7c; color: #d9ccef">WEEKLY</span>
</sc-if>
</div>
</div>
</a>
</sc-for>
</section>
</div>

<nav aria-label="Main" style="background: #140c26; border-top: 1px solid #2a1c44; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 6px 6px 26px 6px">
<a href="Main.dc.html" aria-current="page" style="min-height: 52px; color: {{accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>Home</a>
<a href="Map.dc.html" style="min-height: 52px; color: #b9a8d6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Map</a>
<button aria-label="Create a jam" style="justify-self: center; width: 52px; height: 52px; border-radius: 16px; border: 0; background: {{accent}}; color: #12051f; box-shadow: 0 0 20px {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<button style="min-height: 52px; background: transparent; border: 0; color: #b9a8d6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 11px; font-weight: 500; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 20a6.5 6.5 0 0 0-3-5.5"></path></svg>Friends</button>
<button style="min-height: 52px; background: transparent; border: 0; color: #b9a8d6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 11px; font-weight: 500; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff2e88","options":["#ff2e88","#ff8a3d","#b14cff"]},"neon":{"editor":"color","default":"#22e3ff","options":["#22e3ff","#5dff9e","#ffd23d"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#ff2e88';
const neon = this.props.neon ?? '#22e3ff';
const seat = (full) => "font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 7px; border-radius: 5px; " +
  (full ? 'border: 1px solid ' + accent + '; color: #ffc2dc;' : 'border: 1px solid ' + neon + '; color: ' + neon + ';');
const jams = [
{ day: 'THU', date: '21', time: '20:00', title: 'Blues & soul open session', meta: '0.8 km · Blues, Soul · All levels', seats: '7 / 10', full: false, recurring: false },
{ day: 'FRI', date: '22', time: '19:30', title: 'Jazz standards session', meta: '1.6 km · Jazz, Bebop · Intermediate', seats: 'FULL · WAITLIST', full: true, recurring: true },
{ day: 'SAT', date: '23', time: '16:00', title: 'Garage rock jam', meta: '3.4 km · Rock, Grunge · Beginner', seats: '4 / 6', full: false, recurring: false }
].map((j) => Object.assign({}, j, { seatsStyle: seat(j.full) }));
return { accent, neon, jams };
}
}
</script>
</body>
</html>
